<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#f5f1ea">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <link rel="manifest"
          href="/static/manifest.json">

    <title>Storyteller</title>


    <style>

        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ================================
           BODY
        ================================= */

        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #29251f;

            background-image:

                linear-gradient(
                    rgba(245, 241, 234, 0.35),
                    rgba(245, 241, 234, 0.35)
                ),

                url("/static/background.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* ================================
           APP
        ================================= */

        .app {

            width: 100%;
            height: 100vh;

            position: relative;
        }


        /* ================================
           NEW STORY
        ================================= */

        .new-story {

            position: absolute;

            top: 24px;
            right: 28px;

            z-index: 20;

            padding: 9px 17px;

            border-radius: 25px;

            border:
                1px solid
                rgba(70, 65, 58, 0.35);

            background:
                rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(5px);

            -webkit-backdrop-filter: blur(5px);

            color: #4d473f;

            font-family: Arial, sans-serif;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;
        }


        .new-story:hover {

            background:
                rgba(255, 255, 255, 0.40);
        }


        /* ================================
           CHAT
        ================================= */

        .chat {

            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 85px;

            overflow-y: auto;

            padding:
                80px
                25px
                30px;

            scroll-behavior: smooth;
        }


        .chat::-webkit-scrollbar {

            width: 5px;
        }


        .chat::-webkit-scrollbar-track {

            background: transparent;
        }


        .chat::-webkit-scrollbar-thumb {

            background:
                rgba(70, 65, 58, 0.25);

            border-radius: 10px;
        }


        /* ================================
           WELCOME
        ================================= */

        .welcome {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 90%;

            text-align: center;

            pointer-events: none;
        }


        .welcome h2 {

            font-size: 42px;

            font-weight: 400;

            letter-spacing: 0.2px;

            text-shadow:
                0 2px 15px
                rgba(255, 255, 255, 0.65);
        }


        /* ================================
           MESSAGES
        ================================= */

        .message {

            display: flex;

            width: 100%;

            margin-bottom: 18px;
        }


        .message.user {

            justify-content: flex-end;
        }


        .bubble {

            max-width: 70%;

            padding:
                12px
                16px;

            border-radius: 15px;

            font-size: 16px;

            line-height: 1.6;

            white-space: pre-wrap;

            box-shadow:
                0 3px 15px
                rgba(40, 35, 30, 0.08);
        }


        /* BOT */

        .message.bot .bubble {

            background:
                rgba(250, 247, 241, 0.72);

            border:
                1px solid
                rgba(100, 90, 80, 0.10);

            border-bottom-left-radius: 4px;

            backdrop-filter: blur(7px);

            -webkit-backdrop-filter: blur(7px);
        }


        /* USER */

        .message.user .bubble {

            background:
                rgba(35, 32, 28, 0.78);

            color: #f8f5ef;

            border-bottom-right-radius: 4px;
        }


        /* ================================
           TYPING
        ================================= */

        .typing {

            display: none;

            justify-content: flex-start;
        }


        .typing .bubble {

            padding:
                14px
                17px;

            background:
                rgba(250, 247, 241, 0.72);

            backdrop-filter: blur(7px);

            -webkit-backdrop-filter: blur(7px);
        }


        .dots {

            display: flex;

            gap: 4px;
        }


        .dots span {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #71695f;

            animation:
                blink 1.3s infinite;
        }


        .dots span:nth-child(2) {

            animation-delay: 0.2s;
        }


        .dots span:nth-child(3) {

            animation-delay: 0.4s;
        }


        @keyframes blink {

            0%,
            60%,
            100% {
                opacity: 0.25;
            }

            30% {
                opacity: 1;
            }
        }


        /* ================================
           INPUT
        ================================= */

        .input-area {

            position: absolute;

            left: 50%;

            bottom: 18px;

            transform:
                translateX(-50%);

            width:
                min(700px, 92%);

            z-index: 20;
        }


        .input-box {

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                7px
                8px
                7px
                18px;

            border-radius: 28px;

            background:
                rgba(250, 247, 241, 0.60);

            border:
                1px solid
                rgba(100, 90, 80, 0.20);

            backdrop-filter: blur(9px);

            -webkit-backdrop-filter: blur(9px);

            box-shadow:
                0 4px 20px
                rgba(40, 35, 30, 0.08);
        }


        /* ================================
           TEXTAREA
        ================================= */

        textarea {

            flex: 1;

            border: none;

            outline: none;

            resize: none;

            background: transparent;

            font-family: Arial, sans-serif;

            font-size: 14px;

            line-height: 1.5;

            color: #29251f;

            max-height: 100px;
        }


        textarea::placeholder {

            color: #777066;
        }


        /* ================================
           SEND
        ================================= */

        .send {

            width: 39px;
            height: 39px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background:
                rgba(38, 34, 29, 0.90);

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.2s;
        }


        .send:hover {

            transform:
                translateY(-1px);

            opacity: 0.85;
        }


        .send:disabled {

            opacity: 0.35;

            cursor: default;

            transform: none;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {


            body {

                background-position:
                    center center;
            }


            .new-story {

                top: 17px;

                right: 17px;

                padding:
                    8px
                    14px;

                font-size: 12px;
            }


            .chat {

                bottom: 80px;

                padding:
                    70px
                    15px
                    25px;
            }


            .welcome h2 {

                font-size: 34px;
            }


            .bubble {

                max-width: 88%;

                font-size: 15px;
            }


            .input-area {

                width: 94%;

                bottom: 12px;
            }


            .input-box {

                padding-left: 15px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- NEW STORY -->

    <button
        class="new-story"
        onclick="newChat()"
    >
        New story
    </button>


    <!-- CHAT -->

    <main
        class="chat"
        id="chat"
    >


        <!-- WELCOME -->

        <div
            class="welcome"
            id="welcome"
        >

            <h2>
                Aao padharo.
            </h2>

        </div>


        <!-- TYPING -->

        <div
            class="message bot typing"
            id="typing"
        >

            <div class="bubble">

                <div class="dots">

                    <span></span>

                    <span></span>

                    <span></span>

                </div>

            </div>

        </div>


    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">


            <textarea
                id="message"
                rows="1"
                placeholder="Say something..."
            ></textarea>


            <button
                class="send"
                id="send"
                onclick="sendMessage()"
            >
                ↑
            </button>


        </div>

    </div>


</div>



<script>


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const messageInput =
        document.getElementById("message");

    const chat =
        document.getElementById("chat");

    const typing =
        document.getElementById("typing");

    const welcome =
        document.getElementById("welcome");

    const sendButton =
        document.getElementById("send");


    /* ========================================================
       SEND MESSAGE
    ======================================================== */

    async function sendMessage() {


        const message =
            messageInput.value.trim();


        if (!message) {

            return;
        }


        /* Hide welcome */

        welcome.style.display =
            "none";


        /* Add user message */

        addMessage(
            message,
            "user"
        );


        /* Clear input */

        messageInput.value = "";

        messageInput.style.height =
            "auto";


        /* Disable button */

        sendButton.disabled =
            true;


        /* Show typing */

        typing.style.display =
            "flex";


        scrollToBottom();


        try {


            const response =
                await fetch(
                    "/chat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server error"
                );
            }


            const data =
                await response.json();


            typing.style.display =
                "none";


            if (data.reply) {

                addMessage(
                    data.reply,
                    "bot"
                );

            }

            else {

                addMessage(
                    "Something went quiet on my side. Try again.",
                    "bot"
                );

            }


        }

        catch (error) {


            console.error(error);


            typing.style.display =
                "none";


            addMessage(
                "Something went quiet on my side. Try again.",
                "bot"
            );

        }


        sendButton.disabled =
            false;


        messageInput.focus();

    }


    /* ========================================================
       ADD MESSAGE
    ======================================================== */

    function addMessage(
        text,
        type
    ) {


        const messageDiv =
            document.createElement(
                "div"
            );


        messageDiv.className =
            "message " + type;


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        bubble.textContent =
            text;


        messageDiv.appendChild(
            bubble
        );


        chat.insertBefore(
            messageDiv,
            typing
        );


        scrollToBottom();

    }


    /* ========================================================
       ENTER TO SEND
    ======================================================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {


                event.preventDefault();


                sendMessage();

            }

        }
    );


    /* ========================================================
       AUTO RESIZE
    ======================================================== */

    messageInput.addEventListener(
        "input",
        function() {


            this.style.height =
                "auto";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    100
                ) + "px";

        }
    );


    /* ========================================================
       SCROLL
    ======================================================== */

    function scrollToBottom() {


        setTimeout(
            function() {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            50
        );

    }


    /* ========================================================
       NEW STORY
    ======================================================== */

    async function newChat() {


        /*
            Clear the visible conversation.
        */


        const messages =
            chat.querySelectorAll(
                ".message"
            );


        messages.forEach(
            function(message) {


                if (
                    !message.classList.contains(
                        "typing"
                    )
                ) {

                    message.remove();

                }

            }
        );


        welcome.style.display =
            "block";


        messageInput.value =
            "";


        messageInput.style.height =
            "auto";


        messageInput.focus();

    }


    /* ========================================================
       START
    ======================================================== */

    messageInput.focus();


</script>


</body>

</html>
