<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#f5f1ea">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <link rel="manifest"
          href="/static/manifest.json">

    <title>Storyteller</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #29251f;
        }


        body {

            background-image:
                linear-gradient(
                    rgba(245, 241, 234, 0.35),
                    rgba(245, 241, 234, 0.35)
                ),
                url("/static/background.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =========================================
           APP
        ========================================= */

        .app {

            width: 100%;

            height: 100vh;

            height: 100dvh;

            display: flex;

            flex-direction: column;

            position: relative;
        }


        /* =========================================
           NEW STORY
        ========================================= */

        .new-story {

            position: absolute;

            top: max(18px, env(safe-area-inset-top));

            right: 18px;

            z-index: 20;

            padding: 9px 16px;

            border-radius: 25px;

            border:
                1px solid
                rgba(70, 65, 58, 0.35);

            background:
                rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(7px);

            -webkit-backdrop-filter: blur(7px);

            color: #4d473f;

            font-family: Arial, sans-serif;

            font-size: 13px;

            cursor: pointer;
        }


        /* =========================================
           CHAT
        ========================================= */

        .chat {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding:
                80px
                18px
                20px;

            scroll-behavior: smooth;

            -webkit-overflow-scrolling: touch;
        }


        .chat::-webkit-scrollbar {

            width: 4px;
        }


        .chat::-webkit-scrollbar-thumb {

            background:
                rgba(70, 65, 58, 0.22);

            border-radius: 10px;
        }


        /* =========================================
           WELCOME
        ========================================= */

        .welcome {

            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 90%;

            text-align: center;

            pointer-events: none;
        }


        .welcome h2 {

            font-size: clamp(
                32px,
                8vw,
                42px
            );

            font-weight: 400;

            letter-spacing: 0.2px;

            text-shadow:
                0 2px 15px
                rgba(255, 255, 255, 0.65);
        }


        /* =========================================
           MESSAGES
        ========================================= */

        .message {

            display: flex;

            width: 100%;

            margin-bottom: 16px;
        }


        .message.user {

            justify-content: flex-end;
        }


        .bubble {

            max-width: min(
                720px,
                82%
            );

            padding:
                11px
                15px;

            border-radius: 15px;

            font-size: 16px;

            line-height: 1.55;

            white-space: pre-wrap;

            word-wrap: break-word;

            box-shadow:
                0 3px 15px
                rgba(40, 35, 30, 0.08);
        }


        .message.bot .bubble {

            background:
                rgba(250, 247, 241, 0.76);

            border:
                1px solid
                rgba(100, 90, 80, 0.10);

            border-bottom-left-radius: 4px;

            backdrop-filter: blur(7px);

            -webkit-backdrop-filter: blur(7px);
        }


        .message.user .bubble {

            background:
                rgba(35, 32, 28, 0.82);

            color: #f8f5ef;

            border-bottom-right-radius: 4px;
        }


        /* =========================================
           TYPING
        ========================================= */

        .typing {

            display: none;

            justify-content: flex-start;
        }


        .typing .bubble {

            padding:
                14px
                17px;

            background:
                rgba(250, 247, 241, 0.76);

            backdrop-filter: blur(7px);

            -webkit-backdrop-filter: blur(7px);
        }


        .dots {

            display: flex;

            gap: 4px;
        }


        .dots span {

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: #71695f;

            animation:
                blink 1.3s infinite;
        }


        .dots span:nth-child(2) {

            animation-delay: 0.2s;
        }


        .dots span:nth-child(3) {

            animation-delay: 0.4s;
        }


        @keyframes blink {

            0%,
            60%,
            100% {
                opacity: 0.25;
            }

            30% {
                opacity: 1;
            }
        }


        /* =========================================
           INPUT AREA
        ========================================= */

        .input-area {

            flex-shrink: 0;

            width: 100%;

            padding:
                8px
                14px
                max(12px, env(safe-area-inset-bottom));

            z-index: 20;
        }


        .input-box {

            width:
                min(700px, 100%);

            margin: auto;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                7px
                8px
                7px
                17px;

            border-radius: 28px;

            background:
                rgba(250, 247, 241, 0.68);

            border:
                1px solid
                rgba(100, 90, 80, 0.20);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 4px 20px
                rgba(40, 35, 30, 0.10);
        }


        /* =========================================
           TEXT INPUT
        ========================================= */

        textarea {

            flex: 1;

            min-width: 0;

            border: none;

            outline: none;

            resize: none;

            background: transparent;

            font-family: Arial, sans-serif;

            font-size: 15px;

            line-height: 1.5;

            color: #29251f;

            max-height: 100px;

            overflow-y: auto;
        }


        textarea::placeholder {

            color: #777066;
        }


        /* =========================================
           SEND
        ========================================= */

        .send {

            width: 39px;

            height: 39px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background:
                rgba(38, 34, 29, 0.90);

            color: white;

            font-size: 17px;

            cursor: pointer;
        }


        .send:disabled {

            opacity: 0.35;

            cursor: default;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {

                background-attachment:
                    scroll;

                background-position:
                    center center;
            }


            .chat {

                padding:
                    75px
                    12px
                    15px;
            }


            .new-story {

                top:
                    max(12px, env(safe-area-inset-top));

                right: 12px;

                padding:
                    8px
                    13px;

                font-size: 12px;
            }


            .bubble {

                max-width: 91%;

                font-size: 15px;

                line-height: 1.5;

                padding:
                    10px
                    13px;
            }


            .input-area {

                padding-left: 10px;

                padding-right: 10px;

                padding-bottom:
                    max(
                        10px,
                        env(safe-area-inset-bottom)
                    );
            }


            .input-box {

                padding-left: 14px;
            }


            textarea {

                font-size: 15px;
            }

        }


    </style>

</head>


<body>


<div class="app">


    <button
        class="new-story"
        onclick="newChat()"
    >
        New story
    </button>


    <main
        class="chat"
        id="chat"
    >


        <div
            class="welcome"
            id="welcome"
        >

            <h2>
                Aao padharo.
            </h2>

        </div>


        <div
            class="message bot typing"
            id="typing"
        >

            <div class="bubble">

                <div class="dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>


    </main>


    <div class="input-area">

        <div class="input-box">


            <textarea
                id="message"
                rows="1"
                placeholder="Say something..."
            ></textarea>


            <button
                class="send"
                id="send"
                onclick="sendMessage()"
            >
                ↑
            </button>


        </div>

    </div>


</div>


<script>


const messageInput =
    document.getElementById("message");

const chat =
    document.getElementById("chat");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const sendButton =
    document.getElementById("send");



/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {

        return;

    }


    welcome.style.display =
        "none";


    addMessage(
        message,
        "user"
    );


    messageInput.value =
        "";

    messageInput.style.height =
        "auto";


    sendButton.disabled =
        true;


    typing.style.display =
        "flex";


    scrollToBottom();


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        typing.style.display =
            "none";


        if (data.reply) {

            addMessage(
                data.reply,
                "bot"
            );

        }

        else {

            addMessage(
                "Something went quiet on my side. Try again.",
                "bot"
            );

        }


    }

    catch (error) {

        console.error(error);


        typing.style.display =
            "none";


        addMessage(
            "Something went quiet on my side. Try again.",
            "bot"
        );

    }


    sendButton.disabled =
        false;


    messageInput.focus();

}



/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    text,
    type
) {

    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    messageDiv.appendChild(
        bubble
    );


    chat.insertBefore(
        messageDiv,
        typing
    );


    scrollToBottom();

}



/* =========================================
   ENTER TO SEND
========================================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================================
   AUTO RESIZE
========================================= */

messageInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                100
            ) + "px";

    }
);



/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

    requestAnimationFrame(
        function() {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}



/* =========================================
   NEW STORY
========================================= */

async function newChat() {

    try {

        await fetch(
            "/new-chat",
            {
                method: "POST"
            }
        );

    }

    catch (error) {

        console.error(error);

    }


    const messages =
        chat.querySelectorAll(
            ".message"
        );


    messages.forEach(
        function(message) {

            if (
                !message.classList.contains(
                    "typing"
                )
            ) {

                message.remove();

            }

        }
    );


    welcome.style.display =
        "block";


    messageInput.value =
        "";

    messageInput.style.height =
        "auto";


    messageInput.focus();

}


messageInput.focus();


</script>


<!-- =========================================
     PWA SERVICE WORKER
========================================= -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "/static/service-worker.js"
            )
            .then(
                function() {

                    console.log(
                        "Service Worker registered successfully."
                    );

                }
            )
            .catch(
                function(error) {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                }
            );

        }
    );

}

</script>


</body>

</html>
