<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#f5f1ea">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <link rel="manifest"
          href="/static/manifest.json">

    <title>Storyteller</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #29251f;
        }


        /* =====================================================
           ORIGINAL STORYTELLER BACKGROUND
        ===================================================== */

        body {

            background-image:
                linear-gradient(
                    rgba(245, 241, 234, 0.35),
                    rgba(245, 241, 234, 0.35)
                ),
                url("/static/background.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* =====================================================
           STARTUP / LOADING SCREEN
        ===================================================== */

        #startup-screen {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(255, 224, 235, 0.48),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 15% 90%,
                    rgba(214, 204, 249, 0.38),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 88% 85%,
                    rgba(255, 220, 202, 0.40),
                    transparent 35%
                ),
                #fcfbfd;

            opacity: 1;

            visibility: visible;

            transition:
                opacity 0.75s ease,
                visibility 0.75s ease;
        }


        #startup-screen.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        /* Soft animated glow */

        .startup-glow {

            position: absolute;

            width: 340px;

            height: 340px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(205, 190, 248, 0.25),
                    transparent 68%
                );

            filter: blur(10px);

            animation:
                softGlow 4s ease-in-out infinite;
        }


        @keyframes softGlow {

            0%,
            100% {

                transform: scale(0.92);

                opacity: 0.55;
            }

            50% {

                transform: scale(1.08);

                opacity: 0.95;
            }
        }


        /* Bottom subtle curves */

        .startup-wave {

            position: absolute;

            bottom: -120px;

            width: 720px;

            height: 240px;

            border-radius: 50%;

            border-top:
                1px solid
                rgba(207, 196, 240, 0.35);

            opacity: 0.8;
        }


        .startup-wave.one {

            left: -260px;

            transform: rotate(-7deg);
        }


        .startup-wave.two {

            right: -270px;

            transform: rotate(8deg);
        }


        /* Loading content */

        .startup-content {

            position: relative;

            z-index: 5;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            animation:
                startupAppear 0.9s ease both;
        }


        @keyframes startupAppear {

            from {

                opacity: 0;

                transform:
                    translateY(10px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           MINIMAL BOOK SYMBOL
        ===================================================== */

        .book {

            position: relative;

            width: 92px;

            height: 68px;

            margin-bottom: 28px;

            animation:
                bookFloat 3.2s ease-in-out infinite;
        }


        @keyframes bookFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-6px);
            }
        }


        .book-left,
        .book-right {

            position: absolute;

            top: 5px;

            width: 43px;

            height: 55px;

            background:
                rgba(255, 255, 255, 0.30);

            box-shadow:
                0 5px 18px
                rgba(194, 167, 238, 0.12);
        }


        .book-left {

            left: 3px;

            border:
                2px solid
                #c5b4f5;

            border-right:
                1px solid
                #d7c7f7;

            border-radius:
                7px 2px 3px 10px;

            transform:
                skewY(7deg);
        }


        .book-right {

            right: 3px;

            border:
                2px solid
                #e5b4d5;

            border-left:
                1px solid
                #edc4dc;

            border-radius:
                2px 7px 10px 3px;

            transform:
                skewY(-7deg);
        }


        .book-center {

            position: absolute;

            left: 50%;

            top: 6px;

            width: 2px;

            height: 57px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    to bottom,
                    #c8b5f4,
                    #e8b7d7
                );

            border-radius: 4px;
        }


        .book-base {

            position: absolute;

            left: 50%;

            bottom: 3px;

            width: 54px;

            height: 8px;

            transform:
                translateX(-50%);

            border-bottom:
                2px solid
                #d0baf1;

            border-radius: 50%;
        }


        /* =====================================================
           SMALL SPARKLES
        ===================================================== */

        .sparkle {

            position: absolute;

            width: 7px;

            height: 7px;

            border-radius: 2px;

            transform: rotate(45deg);

            animation:
                sparklePulse 2.2s ease-in-out infinite;
        }


        .sparkle.one {

            top: -7px;

            left: 13px;

            background: #c8b5f4;
        }


        .sparkle.two {

            top: -18px;

            left: 43px;

            width: 10px;

            height: 10px;

            background: #efb7d5;

            animation-delay:
                0.35s;
        }


        .sparkle.three {

            top: 1px;

            right: 11px;

            background: #f4c3ae;

            animation-delay:
                0.7s;
        }


        @keyframes sparklePulse {

            0%,
            100% {

                opacity: 0.35;

                transform:
                    rotate(45deg)
                    scale(0.75);
            }

            50% {

                opacity: 1;

                transform:
                    rotate(45deg)
                    scale(1.15);
            }
        }


        /* =====================================================
           GETTING THINGS READY
        ===================================================== */

        .startup-text {

            font-family:
                Arial,
                sans-serif;

            font-size: 15px;

            font-weight: 400;

            letter-spacing: 0.4px;

            color: #9d91d8;

            animation:
                textBreath 2.4s ease-in-out infinite;
        }


        @keyframes textBreath {

            0%,
            100% {

                opacity: 0.50;
            }

            50% {

                opacity: 1;
            }
        }


        /* =====================================================
           MAIN APP
        ===================================================== */

        .app {

            width: 100%;

            height: 100vh;

            height: 100dvh;

            display: flex;

            flex-direction: column;

            position: relative;
        }


        /* =====================================================
           NEW STORY BUTTON
        ===================================================== */

        .new-story {

            position: absolute;

            top:
                max(
                    18px,
                    env(safe-area-inset-top)
                );

            right: 18px;

            z-index: 20;

            padding:
                9px 16px;

            border-radius: 25px;

            border:
                1px solid
                rgba(70, 65, 58, 0.35);

            background:
                rgba(255, 255, 255, 0.22);

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            color: #4d473f;

            font-family:
                Arial,
                sans-serif;

            font-size: 13px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .new-story:active {

            transform: scale(0.96);

            background:
                rgba(255, 255, 255, 0.40);
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding:
                80px
                18px
                20px;

            scroll-behavior: smooth;

            -webkit-overflow-scrolling: touch;
        }


        .chat::-webkit-scrollbar {

            width: 4px;
        }


        .chat::-webkit-scrollbar-thumb {

            background:
                rgba(70, 65, 58, 0.22);

            border-radius: 10px;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {

            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 90%;

            text-align: center;

            pointer-events: none;
        }


        .welcome h2 {

            font-size:
                clamp(
                    32px,
                    8vw,
                    42px
                );

            font-weight: 400;

            letter-spacing: 0.2px;

            text-shadow:
                0 2px 15px
                rgba(255, 255, 255, 0.65);
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {

            display: flex;

            width: 100%;

            margin-bottom: 16px;
        }


        .message.user {

            justify-content: flex-end;
        }


        .bubble {

            max-width:
                min(
                    720px,
                    82%
                );

            padding:
                11px 15px;

            border-radius: 15px;

            font-size: 16px;

            line-height: 1.55;

            white-space: pre-wrap;

            word-wrap: break-word;

            box-shadow:
                0 3px 15px
                rgba(40, 35, 30, 0.08);
        }


        .message.bot .bubble {

            background:
                rgba(
                    250,
                    247,
                    241,
                    0.76
                );

            border:
                1px solid
                rgba(100, 90, 80, 0.10);

            border-bottom-left-radius: 4px;

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);
        }


        .message.user .bubble {

            background:
                rgba(
                    35,
                    32,
                    28,
                    0.82
                );

            color: #f8f5ef;

            border-bottom-right-radius: 4px;
        }


        /* =====================================================
           AI TYPING
        ===================================================== */

        .typing {

            display: none;

            justify-content:
                flex-start;
        }


        .typing .bubble {

            padding:
                14px 17px;

            background:
                rgba(
                    250,
                    247,
                    241,
                    0.76
                );

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);
        }


        .dots {

            display: flex;

            gap: 4px;
        }


        .dots span {

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: #71695f;

            animation:
                blink 1.3s infinite;
        }


        .dots span:nth-child(2) {

            animation-delay:
                0.2s;
        }


        .dots span:nth-child(3) {

            animation-delay:
                0.4s;
        }


        @keyframes blink {

            0%,
            60%,
            100% {

                opacity: 0.25;
            }

            30% {

                opacity: 1;
            }
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {

            flex-shrink: 0;

            width: 100%;

            padding:
                8px
                14px
                max(
                    12px,
                    env(safe-area-inset-bottom)
                );

            z-index: 20;
        }


        .input-box {

            width:
                min(
                    700px,
                    100%
                );

            margin: auto;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                7px
                8px
                7px
                17px;

            border-radius: 28px;

            background:
                rgba(
                    250,
                    247,
                    241,
                    0.68
                );

            border:
                1px solid
                rgba(100, 90, 80, 0.20);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            box-shadow:
                0 4px 20px
                rgba(40, 35, 30, 0.10);
        }


        /* =====================================================
           TEXTAREA
        ===================================================== */

        textarea {

            flex: 1;

            min-width: 0;

            border: none;

            outline: none;

            resize: none;

            background: transparent;

            font-family:
                Arial,
                sans-serif;

            font-size: 15px;

            line-height: 1.5;

            color: #29251f;

            max-height: 100px;

            overflow-y: auto;
        }


        textarea::placeholder {

            color: #777066;
        }


        /* =====================================================
           SEND
        ===================================================== */

        .send {

            width: 39px;

            height: 39px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background:
                rgba(
                    38,
                    34,
                    29,
                    0.90
                );

            color: white;

            font-size: 17px;

            cursor: pointer;
        }


        .send:disabled {

            opacity: 0.35;

            cursor: default;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                background-attachment:
                    scroll;

                background-position:
                    center center;
            }


            .chat {

                padding:
                    75px
                    12px
                    15px;
            }


            .new-story {

                top:
                    max(
                        12px,
                        env(safe-area-inset-top)
                    );

                right: 12px;

                padding:
                    8px 13px;

                font-size: 12px;
            }


            .bubble {

                max-width: 91%;

                font-size: 15px;

                line-height: 1.5;

                padding:
                    10px 13px;
            }


            .input-area {

                padding-left: 10px;

                padding-right: 10px;

                padding-bottom:
                    max(
                        10px,
                        env(safe-area-inset-bottom)
                    );
            }


            .input-box {

                padding-left: 14px;
            }


            textarea {

                font-size: 15px;
            }


            .startup-text {

                font-size: 14px;
            }


            .book {

                transform: scale(0.90);
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     STARTUP SCREEN
===================================================== -->

<div id="startup-screen">

    <div class="startup-glow"></div>

    <div class="startup-wave one"></div>

    <div class="startup-wave two"></div>


    <div class="startup-content">


        <div class="book">

            <div class="sparkle one"></div>

            <div class="sparkle two"></div>

            <div class="sparkle three"></div>


            <div class="book-left"></div>

            <div class="book-right"></div>

            <div class="book-center"></div>

            <div class="book-base"></div>

        </div>


        <div class="startup-text">
            getting things ready
        </div>


    </div>

</div>


<!-- =====================================================
     MAIN APP
===================================================== -->

<div class="app">


    <button
        class="new-story"
        onclick="newChat()"
    >
        New story
    </button>


    <main
        class="chat"
        id="chat"
    >


        <div
            class="welcome"
            id="welcome"
        >

            <h2>
                Aao padharo.
            </h2>

        </div>


        <div
            class="message bot typing"
            id="typing"
        >

            <div class="bubble">

                <div class="dots">

                    <span></span>

                    <span></span>

                    <span></span>

                </div>

            </div>

        </div>


    </main>


    <div class="input-area">

        <div class="input-box">


            <textarea
                id="message"
                rows="1"
                placeholder="Say something..."
            ></textarea>


            <button
                class="send"
                id="send"
                onclick="sendMessage()"
            >
                ↑
            </button>


        </div>

    </div>


</div>


<script>


/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById("message");

const chat =
    document.getElementById("chat");

const typing =
    document.getElementById("typing");

const welcome =
    document.getElementById("welcome");

const sendButton =
    document.getElementById("send");


/* =====================================================
   STARTUP SCREEN
===================================================== */

window.addEventListener(
    "load",
    function() {

        /*
         * Keep the custom loading screen visible
         * briefly after the page is ready.
         */

        setTimeout(
            function() {

                const startupScreen =
                    document.getElementById(
                        "startup-screen"
                    );

                if (!startupScreen) {
                    return;
                }


                startupScreen.classList.add(
                    "hide"
                );


                setTimeout(
                    function() {

                        if (
                            startupScreen &&
                            startupScreen.parentNode
                        ) {

                            startupScreen.remove();

                        }

                        messageInput.focus();

                    },
                    800
                );

            },
            1200
        );

    }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {

        return;

    }


    welcome.style.display =
        "none";


    addMessage(
        message,
        "user"
    );


    messageInput.value =
        "";

    messageInput.style.height =
        "auto";


    sendButton.disabled =
        true;


    typing.style.display =
        "flex";


    scrollToBottom();


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        typing.style.display =
            "none";


        if (data.reply) {

            addMessage(
                data.reply,
                "bot"
            );

        }

        else {

            addMessage(
                "Something went quiet on my side. Try again.",
                "bot"
            );

        }


    }

    catch (error) {

        console.error(error);


        typing.style.display =
            "none";


        addMessage(
            "Something went quiet on my side. Try again.",
            "bot"
        );

    }


    sendButton.disabled =
        false;


    messageInput.focus();

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    text,
    type
) {

    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    messageDiv.appendChild(
        bubble
    );


    chat.insertBefore(
        messageDiv,
        typing
    );


    scrollToBottom();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

messageInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                100
            ) + "px";

    }
);


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

    requestAnimationFrame(
        function() {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* =====================================================
   NEW STORY
===================================================== */

async function newChat() {

    try {

        await fetch(
            "/new-chat",
            {
                method: "POST"
            }
        );

    }

    catch (error) {

        console.error(error);

    }


    const messages =
        chat.querySelectorAll(
            ".message"
        );


    messages.forEach(
        function(message) {

            if (
                !message.classList.contains(
                    "typing"
                )
            ) {

                message.remove();

            }

        }
    );


    welcome.style.display =
        "block";


    messageInput.value =
        "";

    messageInput.style.height =
        "auto";


    messageInput.focus();

}


</script>


<!-- =====================================================
     PWA SERVICE WORKER
===================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "/static/service-worker.js"
            )
            .then(
                function() {

                    console.log(
                        "Service Worker registered successfully."
                    );

                }
            )
            .catch(
                function(error) {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                }
            );

        }
    );

}

</script>


</body>

</html>
